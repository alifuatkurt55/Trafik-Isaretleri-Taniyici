name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      
      - name: Fresh LFS Push (Images Included)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Kimlik ayarları
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          # 2. Geçmişi temizle (Hata almamak için sıfırdan kurulum)
          rm -rf .git
          git init
          git branch -m main
          
          # 3. LFS Kurulumu
          git lfs install
          
          # 4. KURAL EKLEME BÖLÜMÜ (Burası Güncellendi)
          # Hem modelleri HEM DE resimleri LFS ile takip et
          git lfs track "*.pkl"
          git lfs track "*.h5"
          git lfs track "*.png"
          git lfs track "*.jpg"
          git lfs track "*.jpeg"
          git lfs track "dataset/**/*.png"
          git lfs track "dataset/**/*.jpg"
          
          # 5. Kuralları kaydet
          git add .gitattributes
          
          # 6. Dosyaları ekle
          # (LFS kuralları sayesinde resimler ve modeller otomatik paketlenecek)
          git add .
          
          # 7. Paketle ve Gönder
          git commit -m "Deploy with LFS (Models and Images)"
          
          git push --force https://alifuatkurt:$HF_TOKEN@huggingface.co/spaces/alifuatkurt/trafik-isaretleri-taniyici main
