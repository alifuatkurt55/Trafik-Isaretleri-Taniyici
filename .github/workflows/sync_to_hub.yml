name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      
      - name: Fresh LFS Push (Ultra Light - No Datasets)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Kimlik ayarları
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          # 2. AĞIR YÜKLERİ TEMİZLEME (Hata Kaynağı)
          echo "Gereksiz veri setleri temizleniyor..."
          
          # Eğitim resimlerini sil (30.000+ dosya)
          rm -rf dataset/Train
          
          # Test resimlerini sil (1.600+ dosya - Şu anki hatanın sebebi)
          rm -rf dataset/Test
          
          # (Opsiyonel) Eğer Meta klasörü varsa kalsın, yoksa sorun yok.
          # dataset/Meta klasörü genelde küçük olduğu için kalabilir.
          
          # 3. Geçmişi tamamen sil ve Git'i yeniden başlat
          rm -rf .git
          git init
          git branch -m main
          
          # 4. LFS Kurulumu
          git lfs install
          
          # 5. KURAL EKLEME
          # Sadece model dosyalarını büyük dosya olarak işaretle
          git lfs track "*.pkl"
          git lfs track "*.h5"
          
          # Kalan az sayıdaki resim (logo, meta vb.) için kural
          git lfs track "*.png"
          git lfs track "*.jpg"
          
          # 6. Kuralları kaydet
          git add .gitattributes
          
          # 7. Dosyaları ekle
          # Artık binlerce resim olmadığı için işlem saniyeler sürecek
          git add .
          
          # 8. Paketle ve Gönder
          git commit -m "Deploy Ultra Light (Only App & Model)"
          
          git push --force https://alifuatkurt:$HF_TOKEN@huggingface.co/spaces/alifuatkurt/trafik-isaretleri-taniyici main
