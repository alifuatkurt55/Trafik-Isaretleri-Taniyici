name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      
      - name: Fresh LFS Push (Optimized - No Training Data)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Kimlik ayarları
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          # 2. AĞIR YÜKTEN KURTULMA ADIMI (30.000 Resmi Sil)
          # Model zaten eğitildiği için Train klasörünü sunucuya yüklemeye gerek yok.
          # Bu işlem GitHub'daki dosyalarınızı silmez, sadece Hugging Face'e giden paketi hafifletir.
          echo "Gereksiz eğitim verileri temizleniyor..."
          rm -rf dataset/Train
          
          # 3. Geçmişi temizle ve Git'i yeniden başlat
          rm -rf .git
          git init
          git branch -m main
          
          # 4. LFS Kurulumu
          git lfs install
          
          # 5. KURAL EKLEME
          # Sadece gerekli olan model ve test resimlerini LFS yapıyoruz
          git lfs track "*.pkl"
          git lfs track "*.h5"
          # Train klasörünü sildiğimiz için binlerce resimle uğraşmayacak
          # Sadece kalan test resimleri için kural ekliyoruz:
          git lfs track "*.png"
          git lfs track "*.jpg"
          
          # 6. Kuralları kaydet
          git add .gitattributes
          
          # 7. Dosyaları ekle
          git add .
          
          # 8. Paketle ve Gönder
          git commit -m "Deploy Optimized (Training Data Excluded)"
          
          git push --force https://alifuatkurt:$HF_TOKEN@huggingface.co/spaces/alifuatkurt/trafik-isaretleri-taniyici main
