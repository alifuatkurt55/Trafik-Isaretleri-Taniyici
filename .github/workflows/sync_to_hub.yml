name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      
      - name: Fresh LFS Push (With ZIP Support)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Kimlik ayarları
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          # 2. TEMİZLİK İŞLEMİ
          # Açık haldeki klasörleri siliyoruz ki binlerce dosya yükü olmasın.
          # Ancak ana dizindeki 'veri.zip' dosyasına dokunmuyoruz, o gidecek.
          echo "Gereksiz açık klasörler temizleniyor..."
          rm -rf dataset/Train
          rm -rf dataset/Test
          
          # 3. Geçmişi tamamen sil ve Git'i yeniden başlat
          rm -rf .git
          git init
          git branch -m main
          
          # 4. LFS Kurulumu
          git lfs install
          
          # 5. KURAL EKLEME (ÖNEMLİ GÜNCELLEME)
          # Modelleri ve görselleri takip et
          git lfs track "*.pkl"
          git lfs track "*.h5"
          git lfs track "*.png"
          git lfs track "*.jpg"
          
          # ---> ZIP DOSYASI İÇİN İZİN <---
          git lfs track "*.zip"
          
          # 6. Kuralları kaydet
          git add .gitattributes
          
          # 7. Dosyaları ekle
          # GitHub ana sayfasında veri.zip varsa, burada pakete eklenecektir.
          git add .
          
          # 8. Paketle ve Gönder
          git commit -m "Deploy with Dataset ZIP"
          
          git push --force https://alifuatkurt:$HF_TOKEN@huggingface.co/spaces/alifuatkurt/trafik-isaretleri-taniyici main
