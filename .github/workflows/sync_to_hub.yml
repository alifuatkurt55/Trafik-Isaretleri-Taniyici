name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      # 1. Dosyaları GitHub'dan indir (Büyük dosyaları da indir)
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      
      - name: Fresh LFS Push
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # --- AYARLAR ---
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          # --- KRİTİK HAMLE: GEÇMİŞİ SİL ---
          # Eski commit geçmişini siliyoruz ki Hugging Face eski büyük dosyaları görmesin.
          rm -rf .git
          
          # --- YENİDEN BAŞLAT ---
          git init
          git branch -m main
          
          # --- LFS KURULUMU ---
          git lfs install
          # Büyük dosyaları takibe al
          git lfs track "*.pkl"
          git lfs track "*.h5"
          git lfs track "model/*.pkl"
          git lfs track "model/*.h5"
          
          # .gitattributes dosyasını oluştur/ekle
          git add .gitattributes
          
          # --- DOSYALARI EKLE VE GÖNDER ---
          # Şimdi eklediğimizde büyük dosyalar otomatik olarak LFS'e dönüşecek
          git add .
          
          git commit -m "Deploy from GitHub Actions (Fresh LFS Build)"
          
          # Zorla gönder
          git push --force https://alifuatkurt:$HF_TOKEN@huggingface.co/spaces/alifuatkurt/trafik-isaretleri-taniyici main
